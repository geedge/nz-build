# 定义全局docker镜像
image: git.mesalab.cn:7443/nezha/nz-build-env:1.5
# 定义全局变量
variables:
  # minio 连接信息
  MINIO_HOST: 'http://192.168.40.48:2020/'
  MINIO_USER: 'admin'
  MINIO_PWD: "Nezha@02!"
  MAVEN_REPO: "/etc/maven/repository/"
  # ftp 连接信息
  FTP_HOST: 'ftp://192.168.44.24/Nezha/'
  FTP_USER: 'Nezha'
  FTP_PWD: 'Nezha_qaz12#'
  # mariadb 数据库定义（非必须）
  MYSQL_DATABASE: "nezha"
  # mariadb 密码配置（必须），注意变量名是 MYSQL_ROOT_PASSWORD
  MYSQL_ROOT_PASSWORD: '111111'
  MYSQL_PORT: 3306
# 定义全局依赖的docker服务，即 这条流水线 pipeline 中的任务都用这里的服务
services:
  - mariadb:10.2.14
before_script:
  - echo "begin ci"
  - date
  - echo "begin ci over"
after_script:
  - echo "end ci"
  - echo "end over"
stages:
  - build

build_rpm:
  stage: build
  script:
    - env | sort
    - echo "exec a"
    - chmod +x ./tools/package.sh
    - ./tools/package.sh
    - echo "exec b"
  # 在哪个分支上可用
  only:
    - dev-runner
  tags:
    - nezha
