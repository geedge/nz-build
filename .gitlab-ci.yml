# 定义全局docker镜像
image: git.mesalab.cn:7443/nezha/nz-build-env:1.5
# 定义全局变量
variables:
  # minio 连接信息
  MINIO_HOST: 'http://192.168.40.48:2020/'
  MINIO_USER: 'admin'
  MINIO_PWD: "Nezha@02!"
# 开始执行脚本前所需执行脚本
before_script:
  - echo "begin ci"
# 脚本执行完后的钩子，执行所需脚本
after_script:
  - echo "end ci"
# 该ci pipeline适合的场景，按照定义的顺序执行任务
stages:
  - build

# 定义的任务
build_rpm:
  stage: build
  # 所需执行的脚本
  script:
    - env | sort
    - chmod +x ./tools/package.sh
    - ./tools/package.sh
    - chmod +x ./deb_tools/package.sh
    - ./deb_tools/package.sh
  # 在哪个分支上可用
  only:
    - /^nz_ipmi_exporter-.*$/i
  # 指定哪个ci runner跑该工作
  tags:
    - nezha
